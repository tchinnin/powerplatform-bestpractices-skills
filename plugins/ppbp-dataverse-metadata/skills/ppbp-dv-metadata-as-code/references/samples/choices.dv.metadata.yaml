# yaml-language-server: $schema=../schemas/choices.schema.json
choices:
  prfx_crm_choice_CustomerSegment:
    label: Customer Segment Choice          # Display Name always ends with " Choice"
    description: Commercial segmentation of a customer.
    options:
      - {value: 100000000, label: Standard, color: "#9EA6B3"}
      - {value: 100000001, label: Premium,  color: "#1B8ED4"}
      - {value: 100000002, label: Key Account, color: "#FFB900"}

  prfx_crm_choice_Industry:
    label: Industry Choice
    description: Industries a customer operates in (multi-select).
    options:
      - {value: 100000000, label: Technology}
      - {value: 100000001, label: Finance}
      - {value: 100000002, label: Healthcare}
      - {value: 100000003, label: Manufacturing}

  prfx_crm_choice_OrderStatus:
    label: Order Status Choice
    description: Lifecycle of a customer order.
    options:
      - {value: 100000000, label: Draft,     color: "#9EA6B3"}
      - {value: 100000001, label: Confirmed, color: "#1B8ED4"}
      - {value: 100000002, label: Shipped,   color: "#37B400"}
      - {value: 100000003, label: Cancelled, color: "#E81123"}
